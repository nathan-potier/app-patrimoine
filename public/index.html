<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Patrimoine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="app">
        <h1>Dashboard Patrimoine</h1>
        <button id="login-btn">Connexion avec Google</button>
        <div id="user-info"></div>
    </div>

    <!-- Script en type="module" (Méthode moderne) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ REMPLACE PAR TA VRAIE CONFIGURATION TROUVÉE SUR LA CONSOLE
        const firebaseConfig = {
            apiKey: "AIzaSyATXciA0jR4liu_YbQaZgsV3dmAWHxIs3Y",
            authDomain: "mypatrimoine-12ea8.firebaseapp.com",
            projectId: "mypatrimoine-12ea8",
            storageBucket: "mypatrimoine-12ea8.firebasestorage.app",
            messagingSenderId: "264004329695",
            appId: "1:264004329695:web:ec7a03f6fb3f912859096a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('login-btn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                document.getElementById('user-info').innerText = `Connecté : ${result.user.email}`;
            } catch (error) {
                console.error("Erreur", error);
            }
        });
    </script>
</body>
</html>
